name: Black Cat DNS Chat Control
on:
  push:
    branches: [main]
    paths: ["working/dns/control/request.json"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: black-cat-codespaces-control
  cancel-in-progress: false
jobs:
  codespaces:
    if: github.repository == 'efrgdgr0024345/test1' && github.ref == 'refs/heads/main' && github.actor == 'efrgdgr0024345'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout the exact trusted command commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, immutable
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5, immutable
        with:
          python-version: "3.13"
      - name: Install controller and verification dependencies without credentials
        run: python -m pip install -r working/dns/requirements.txt -r working/dns/control/requirements.txt
      - name: Run regressions before allowing cloud changes
        run: python -m unittest discover -s working/dns -p 'test*.py' -v
      - name: Execute command and emit only encrypted session details
        env:
          BLACKCAT_CODESPACES_PAT: ${{ secrets.BLACKCAT_CODESPACES_PAT }}
        run: python working/dns/control/controller.py
