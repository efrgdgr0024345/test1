name: Black Cat DoH tests
on:
  push:
    branches: [main, black-cat-doh]
    paths:
      - "working/dns/**"
      - ".devcontainer/**"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "working/dns/**"
      - ".devcontainer/**"
      - ".github/workflows/**"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - run: python -m pip install -r working/dns/requirements.txt -r working/dns/control/requirements.txt
      - name: Python and shell syntax
        run: |
          python -m compileall -q working/dns
          find working/dns -name '*.sh' -print0 | xargs -0 -n1 bash -n
      - name: DNS, deployment, encryption and cloud-control regressions
        run: python -m unittest discover -s working/dns -p 'test*.py' -v
      - name: Live encrypted upstream consensus probe (not a public deployment)
        run: |
          cd working/dns
          timeout 60 python - <<'PY'
          import json
          from server import Engine, Provider, public
          providers = [Provider.load(r) for r in json.load(open('resolvers.json'))]
          engine = Engine(providers, 60)
          try:
              report = engine.gate('unicast.uncensoreddns.org.')
              print(json.dumps(public(report), indent=2))
              assert report['status'] == 'match' and report['allowed'], 'Live upstream consensus failed'
          finally:
              engine.close()
          PY
