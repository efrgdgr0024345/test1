name: Black Cat DNS Expiry Cleanup
on:
  schedule:
    - cron: '7,17,27,37,47,57 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: black-cat-codespaces-control
  cancel-in-progress: false
jobs:
  reap:
    if: github.repository == 'efrgdgr0024345/test1' && github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.actor == 'efrgdgr0024345')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - run: python -m pip install -r working/dns/control/requirements.txt
      - name: Stop only expired managed machines; never delete a Codespace
        env:
          BLACKCAT_CODESPACES_PAT: ${{ secrets.BLACKCAT_CODESPACES_PAT }}
        run: python working/dns/control/controller.py --reap
