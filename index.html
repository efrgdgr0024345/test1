<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Math Training Lab</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="app-header">
      <h1>Math Training Lab</h1>
      <p>Scientific calculator rebuilt with a proper keypad, live expression display, and calculation history.</p>
    </header>

    <main class="app-layout">
      <section class="calculator-panel" id="calculator-panel" aria-label="Scientific calculator">
        <div class="panel-header">
          <h2>Scientific Calculator</h2>
          <div class="panel-actions">
            <label for="panel-size">Size</label>
            <input id="panel-size" type="range" min="320" max="640" value="430" />
            <button id="minimize-button" type="button" aria-expanded="true">Minimize</button>
          </div>
        </div>

        <div class="calculator-shell">
          <div class="status-row">
            <span id="mode-indicator">Mode: DEG</span>
            <span id="memory-indicator">M: 0</span>
          </div>

          <div class="display-wrap">
            <div id="expression-display" class="expression-display" aria-live="polite">0</div>
            <div id="result-display" class="result-display" aria-live="polite">0</div>
          </div>

          <div class="keypad" id="keypad" aria-label="Calculator keypad">
            <button data-action="all-clear">AC</button>
            <button data-action="delete">DEL</button>
            <button data-action="mode">DEG</button>
            <button data-action="percent">%</button>
            <button data-action="memory-clear">MC</button>
            <button data-action="memory-recall">MR</button>

            <button data-action="memory-add">M+</button>
            <button data-action="memory-subtract">M-</button>
            <button data-token="(">(</button>
            <button data-token=")">)</button>
            <button data-token="^">xʸ</button>
            <button data-action="sqrt">√</button>

            <button data-action="sin">sin</button>
            <button data-action="cos">cos</button>
            <button data-action="tan">tan</button>
            <button data-action="ln">ln</button>
            <button data-action="log">log</button>
            <button data-token="pi">π</button>

            <button data-token="7">7</button>
            <button data-token="8">8</button>
            <button data-token="9">9</button>
            <button data-token="/">÷</button>
            <button data-action="square">x²</button>
            <button data-action="inverse">1/x</button>

            <button data-token="4">4</button>
            <button data-token="5">5</button>
            <button data-token="6">6</button>
            <button data-token="*">×</button>
            <button data-token="e">e</button>
            <button data-action="ans">Ans</button>

            <button data-token="1">1</button>
            <button data-token="2">2</button>
            <button data-token="3">3</button>
            <button data-token="-">−</button>
            <button data-action="sign">±</button>
            <button data-action="factorial">x!</button>

            <button data-token="0" class="span-two">0</button>
            <button data-token=".">.</button>
            <button data-token="+">+</button>
            <button class="equals" data-action="evaluate">=</button>
          </div>
        </div>
      </section>

      <section class="workspace" aria-label="Math training workspace">
        <article class="card trainer-card">
          <h2>Math Training</h2>
          <p id="question-text">Press "New Question" to start.</p>
          <div class="trainer-controls">
            <input id="answer-input" type="number" step="any" placeholder="Your answer" />
            <button id="check-answer" type="button">Check</button>
            <button id="new-question" type="button">New Question</button>
          </div>
          <p id="feedback-text" aria-live="polite"></p>
          <p id="score-text">Score: 0 correct, 0 attempted</p>
        </article>

        <article class="card history-card">
          <div class="history-header">
            <h2>Calculation History</h2>
            <button id="clear-history" type="button">Clear History</button>
          </div>
          <ul id="history-list" aria-live="polite"></ul>
        </article>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
